[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tickcraft"
version = "0.1.0"
description = "A tiny, paper-first Kalshi strategy workbench."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["requests>=2.31,<3", "cryptography>=42"]

[project.scripts]
tickcraft = "tickcraft.__main__:main"

[tool.setuptools.packages.find]
include = ["tickcraft*"]
